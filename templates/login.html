<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Sign in · CloudVault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true">CV</div>
    <p class="eyebrow">PRIVATE CLOUD STORAGE</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your files stored in Amazon S3.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login_submit') }}" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="button button-primary button-full" type="submit">Sign in</button>
    </form>
    <p class="auth-footnote">Access is restricted to the configured account.</p>
  </main>
</body>
</html>
